<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Video Publisher</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem; display: flex; justify-content: center; }

    .publisher-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; text-align: center; }

    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-muted); }

    input[type="text"], textarea, input[type="datetime-local"] {
      width: 100%;
      padding: 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.95rem;
    }

    textarea { resize: vertical; height: 100px; }

    .platform-selector {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
    }

    .platform-option {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--bg);
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .platform-option input { accent-color: var(--accent); }

    .actions { display: flex; gap: 1rem; margin-top: 1.5rem; }
    button {
      flex: 1;
      padding: 0.85rem;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-secondary:hover { background: var(--border); }
  </style>
</head>
<body>

<div class="publisher-card">
  <h1>Publish Short Video</h1>
  
  <form id="publishForm">
    <div class="form-group">
      <label for="postTitle">Video Title / Caption</label>
      <input type="text" id="postTitle" placeholder="Catchy title for your video..." required>
    </div>

    <div class="form-group">
      <label for="postDescription">Description / Hashtags</label>
      <textarea id="postDescription" placeholder="Add descriptions, tags #shorts #reels..."></textarea>
    </div>

    <div class="form-group">
      <label for="videoFile">Upload Video</label>
      <input type="file" id="videoFile" accept="video/*" required style="color: var(--text-muted);">
    </div>

    <div class="form-group">
      <label>Target Platforms</label>
      <div class="platform-selector">
        <label class="platform-option">
          <input type="checkbox" name="platform" value="youtube" checked>
          <span>YouTube Shorts</span>
        </label>
        
        <label class="platform-option">
          <input type="checkbox" name="platform" value="tiktok">
          <span>TikTok</span>
        </label>
        
        <label class="platform-option">
          <input type="checkbox" name="platform" value="instagram">
          <span>Instagram Reels</span>
        </label>

        <label class="platform-option">
          <input type="checkbox" name="platform" value="facebook">
          <span>Facebook Page / Reels</span>
        </label>
      </div>
    </div>

    <div class="form-group">
      <label for="scheduleTime">Schedule (Optional)</label>
      <input type="datetime-local" id="scheduleTime">
    </div>

    <div class="actions">
      <button type="submit" class="btn-primary">Publish Now</button>
      <button type="button" id="scheduleBtn" class="btn-secondary">Queue Post</button>
    </div>
  </form>
</div>

<script>
  const form = document.getElementById('publishForm');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const selectedPlatforms = Array.from(document.querySelectorAll('input[name="platform"]:checked')).map(cb => cb.value);

    if (selectedPlatforms.length === 0) {
      alert('Please select at least one platform.');
      return;
    }

    const payload = {
      title: document.getElementById('postTitle').value,
      description: document.getElementById('postDescription').value,
      platforms: selectedPlatforms,
      scheduleTime: document.getElementById('scheduleTime').value || null,
      timestamp: new Date().toISOString()
    };

    console.log('Dispatching payload to Webhook/API:', payload);
    alert('Payload submitted! Check browser console (F12) to inspect data output.');
    
    // Example endpoint delivery:
    // fetch('YOUR_WEBHOOK_OR_BACKEND_URL', {
    //   method: 'POST',
    //   headers: { 'Content-Type': 'application/json' },
    //   body: JSON.stringify(payload)
    // });
  });
</script>

</body>
</html>
